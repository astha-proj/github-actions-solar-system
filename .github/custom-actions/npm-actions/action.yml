name: 'NPM Custom Action'
description: 'Installing and caching NPM packages for a Node.js project'
inputs:
  path:
    description: 'Path to the directory containing package.json'
    required: true
  node_version:
    description: 'Node.js version used for the dependency cache key'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Cache NPM dependencies
      uses: actions/cache@v3
      with:
        path: ${{ inputs.path }}/node_modules
        key: ${{ runner.os }}-node-${{ inputs.node_version }}-modules-${{ hashFiles(format('{0}/package-lock.json', inputs.path)) }}
    - name: Install NPM packages
      shell: bash
      working-directory: ${{ inputs.path }}
      run: npm ci
