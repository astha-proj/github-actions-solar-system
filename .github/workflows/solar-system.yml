name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
      
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        strategy:
          matrix:
            nodejs_version: [18, 20]
        services:
          mongodb:
            image: mongo:5.0
            env:
              MONGO_INITDB_ROOT_USERNAME: ci-user
              MONGO_INITDB_ROOT_PASSWORD: ci-password
            ports:
              - 27017:27017
            options: >-
              --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5
        env:
          MONGO_URI: mongodb://localhost:27017/superData?authSource=admin
          MONGO_USERNAME: ci-user
          MONGO_PASSWORD: ci-password
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - matrix.nodejs_version
          uses: actions/setup-node@v4
          with:
            node-version: ${{ matrix.nodejs_version }}

        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: v2-${{ runner.os }}-node-${{ matrix.nodejs_version }}-modules-${{ hashFiles('package-lock.json') }}

        - name: Install Dependencies
          run: npm install

        - name: Seed Non-Production Database
          run: node scripts/seed-test-db.js
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result-Node-${{ matrix.nodejs_version }}
            path: test-results.xml

    code-coverage:
        name: Code Coverage
        container:
          image: node:18
        runs-on: ubuntu-latest
        services:
          mongodb:
            image: mongo:5.0
            env:
              MONGO_INITDB_ROOT_USERNAME: ci-user
              MONGO_INITDB_ROOT_PASSWORD: ci-password
            
            options: >-
              --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5
        env:
          MONGO_URI: mongodb://mongodb:27017/superData?authSource=admin
          MONGO_USERNAME: ci-user
          MONGO_PASSWORD: ci-password
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        #- name: Setup NodeJS Version - 18
        #  uses: actions/setup-node@v4
        #  with:
         #   node-version: 18

        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: v2-${{ runner.os }}-node-18-modules-${{ hashFiles('package-lock.json') }}

        - name: Install Dependencies
          run: npm install

        - name: Seed Non-Production Database
          run: node scripts/seed-test-db.js

        - name: Check Code Coverage
          id: code-coverage-check
          continue-on-error: true
          run: npm run coverage

        - name: Archive Coverage Report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5

    docker:
        name: Containerization
        needs: [unit-testing, code-coverage]
        permissions:
          contents: read
          packages: write
        runs-on: ubuntu-latest
        services:
          mongodb:
            image: mongo:5.0
            env:
              MONGO_INITDB_ROOT_USERNAME: ci-user
              MONGO_INITDB_ROOT_PASSWORD: ci-password
            ports:
              - 27017:27017
            options: >-
              --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5
        env:
          MONGO_URI: mongodb://localhost:27017/superData?authSource=admin
          MONGO_USERNAME: ci-user
          MONGO_PASSWORD: ci-password
          DOCKER_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
        steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup NodeJS
          uses: actions/setup-node@v4
          with:
            node-version: 18

        - name: Install Dependencies
          run: npm install

        - name: Seed Non-Production Database
          run: node scripts/seed-test-db.js

        - name: Docker Hub Login
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        - name: GHCR Login
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Docker Build For Testing
          uses: docker/build-push-action@v5
          with:
            context: .
            load: true
            push: false
            tags: ${{ env.DOCKER_IMAGE }}

        - name: Docker Image Test
          id: integration-test
          run: |
            docker images
            docker run --rm --name solar-system-app -d \
              -p 3000:3000 \
              --add-host=host.docker.internal:host-gateway \
              -e MONGO_URI="mongodb://host.docker.internal:27017/superData?authSource=admin" \
              -e MONGO_USERNAME="${MONGO_USERNAME}" \
              -e MONGO_PASSWORD="${MONGO_PASSWORD}" \
              "${DOCKER_IMAGE}"

            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo "Container IP: $IP"
            echo "container_ip=$IP" >> "$GITHUB_OUTPUT"

            echo "Waiting for the app to start..."
            sleep 10

            echo "Testing image URL using curl"
            curl -fsS http://127.0.0.1:3000/live
        - name: Container Registry Push
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: |
              ${{ env.DOCKER_IMAGE }}
              ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

    dev-deploy:
        if: contains(github.ref, 'refs/heads/feature/')
        name: Development Deployment
        needs: docker
        permissions:
          contents: read
          packages: read
        uses: ./.github/workflows/reuse-deployment.yml
        with:
          environment_name: development
          image: ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}
          manifests_path: kubernetes/development
          ingress_host: solar-system-{namespace}.127.0.0.1.nip.io
        secrets:
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}

    prod-deploy:
        if: github.ref == 'refs/heads/main'
        name: Production Deployment
        needs: docker
        permissions:
          contents: read
          packages: read
        uses: ./.github/workflows/reuse-deployment.yml
        with:
          environment_name: production
          image: ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}
          manifests_path: kubernetes/production
          ingress_host: solar-system.127.0.0.1.nip.io
        secrets:
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
