name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
      
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ${{ matrix.operating_system }}
        strategy:
          matrix:
            nodejs_version: [18, 20]
            operating_system: [ubuntu-latest, macos-latest]
            exclude:
              - nodejs_version: 18
                operating_system: macos-latest
        env:
          MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
          MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - matrix.nodejs_version
          uses: actions/setup-node@v4
          with:
            node-version: ${{ matrix.nodejs_version }}

        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: v2-${{ runner.os }}-node-${{ matrix.nodejs_version }}-modules-${{ hashFiles('package-lock.json') }}

        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result-Node-${{ matrix.nodejs_version }}-${{ matrix.operating_system }}
            path: test-results.xml

    code-coverage:
        name: Code Coverage
        runs-on: ubuntu-latest
        env:
          MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
          MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - 18
          uses: actions/setup-node@v4
          with:
            node-version: 18

        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: v2-${{ runner.os }}-node-18-modules-${{ hashFiles('package-lock.json') }}

        - name: Install Dependencies
          run: npm install

        - name: Check Code Coverage
          id: code-coverage-check
          continue-on-error: true
          run: npm run coverage

        - name: Archive Coverage Report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5

    docker:
        name: Containerization
        needs: [unit-testing, code-coverage]
        permissions:
          contents: read
          packages: write
        runs-on: ubuntu-latest
        env:
          MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
          MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          DOCKER_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
        steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Docker Hub Login
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        - name: GHCR Login
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Docker Build For Testing
          uses: docker/build-push-action@v5
          with:
            context: .
            load: true
            push: false
            tags: ${{ env.DOCKER_IMAGE }}

        - name: Docker Image Test
          run: |
            docker images
            docker run --rm --name solar-system-app -d \
              -p 3000:3000 \
              -e MONGO_URI="${MONGO_URI}" \
              -e MONGO_USERNAME="${MONGO_USERNAME}" \
              -e MONGO_PASSWORD="${MONGO_PASSWORD}" \
              "${DOCKER_IMAGE}"

            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo "Container IP: $IP"

            echo "Waiting for the app to start..."
            sleep 10

            echo "Testing image URL using curl"
            curl -fsS http://127.0.0.1:3000/live
        - name: Container Registry Push
          uses: docker/build-push-action@v5
          with:
            context: .
            load: true
            push: true
            tags: |
              ${{ env.DOCKER_IMAGE }}
              ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}
