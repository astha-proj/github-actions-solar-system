name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
      
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        strategy:
          matrix:
            nodejs_version: [18, 20]
        services:
          mongodb:
            image: mongo:5.0
            env:
              MONGO_INITDB_ROOT_USERNAME: ci-user
              MONGO_INITDB_ROOT_PASSWORD: ci-password
            ports:
              - 27017:27017
            options: >-
              --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5
        env:
          MONGO_URI: mongodb://localhost:27017/superData?authSource=admin
          MONGO_USERNAME: ci-user
          MONGO_PASSWORD: ci-password
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - matrix.nodejs_version
          uses: actions/setup-node@v4
          with:
            node-version: ${{ matrix.nodejs_version }}

        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: v2-${{ runner.os }}-node-${{ matrix.nodejs_version }}-modules-${{ hashFiles('package-lock.json') }}

        - name: Install Dependencies
          run: npm install

        - name: Seed Non-Production Database
          run: node scripts/seed-test-db.js
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result-Node-${{ matrix.nodejs_version }}
            path: test-results.xml

    code-coverage:
        name: Code Coverage
        container:
          image: node:18
        runs-on: ubuntu-latest
        services:
          mongodb:
            image: mongo:5.0
            env:
              MONGO_INITDB_ROOT_USERNAME: ci-user
              MONGO_INITDB_ROOT_PASSWORD: ci-password
            
            options: >-
              --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5
        env:
          MONGO_URI: mongodb://mongodb:27017/superData?authSource=admin
          MONGO_USERNAME: ci-user
          MONGO_PASSWORD: ci-password
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        #- name: Setup NodeJS Version - 18
        #  uses: actions/setup-node@v4
        #  with:
         #   node-version: 18

        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: v2-${{ runner.os }}-node-18-modules-${{ hashFiles('package-lock.json') }}

        - name: Install Dependencies
          run: npm install

        - name: Seed Non-Production Database
          run: node scripts/seed-test-db.js

        - name: Check Code Coverage
          id: code-coverage-check
          continue-on-error: true
          run: npm run coverage

        - name: Archive Coverage Report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5

    docker:
        name: Containerization
        needs: [unit-testing, code-coverage]
        permissions:
          contents: read
          packages: write
        runs-on: ubuntu-latest
        services:
          mongodb:
            image: mongo:5.0
            env:
              MONGO_INITDB_ROOT_USERNAME: ci-user
              MONGO_INITDB_ROOT_PASSWORD: ci-password
            ports:
              - 27017:27017
            options: >-
              --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5
        env:
          MONGO_URI: mongodb://localhost:27017/superData?authSource=admin
          MONGO_USERNAME: ci-user
          MONGO_PASSWORD: ci-password
          DOCKER_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
        steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup NodeJS
          uses: actions/setup-node@v4
          with:
            node-version: 18

        - name: Install Dependencies
          run: npm install

        - name: Seed Non-Production Database
          run: node scripts/seed-test-db.js

        - name: Docker Hub Login
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        - name: GHCR Login
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Docker Build For Testing
          uses: docker/build-push-action@v5
          with:
            context: .
            load: true
            push: false
            tags: ${{ env.DOCKER_IMAGE }}

        - name: Docker Image Test
          run: |
            docker images
            docker run --rm --name solar-system-app -d \
              -p 3000:3000 \
              --add-host=host.docker.internal:host-gateway \
              -e MONGO_URI="mongodb://host.docker.internal:27017/superData?authSource=admin" \
              -e MONGO_USERNAME="${MONGO_USERNAME}" \
              -e MONGO_PASSWORD="${MONGO_PASSWORD}" \
              "${DOCKER_IMAGE}"

            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo "Container IP: $IP"

            echo "Waiting for the app to start..."
            sleep 10

            echo "Testing image URL using curl"
            curl -fsS http://127.0.0.1:3000/live
        - name: Container Registry Push
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: |
              ${{ env.DOCKER_IMAGE }}
              ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

    dev-deploy:
        needs: docker
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: read
        env:
          DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}
          NAMESPACE: ${{ vars.NAMESPACE }}
          MONGO_URI: mongodb://mongodb:27017/superData?authSource=admin
          MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        steps:
        - name: Checkout Repo
          uses: actions/checkout@v4

        - name: Login to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Pull Application Image
          run: docker pull "$DOCKER_IMAGE"

        - name: Create Temporary Kubernetes Cluster
          uses: helm/kind-action@v1.10.0
          with:
            cluster_name: kind
            config: .github/kind-config.yaml

        - name: Install kubectl CLI
          uses: azure/setup-kubectl@v3
          with:
            version: 'v1.30.0'

        - name: Check Kubernetes Cluster
          run: |
            kubectl version --client
            kubectl get nodes

        - name: Install NGINX Ingress Controller
          run: |
            kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/kind/deploy.yaml
            kubectl wait --namespace ingress-nginx \
              --for=condition=Ready pod \
              --selector=app.kubernetes.io/component=controller \
              --timeout=180s || {
                kubectl get pods --namespace ingress-nginx -o wide
                kubectl describe pods --namespace ingress-nginx
                kubectl logs --namespace ingress-nginx \
                  --selector=app.kubernetes.io/component=controller \
                  --all-containers=true --tail=100 || true
                exit 1
              }

        - name: Load Application Image into kind
          run: |
            kind load docker-image "$DOCKER_IMAGE"

        - name: Save NGINX Ingress Address
          run: |
            echo "INGRESS_IP=127.0.0.1" >> "$GITHUB_ENV"

        - name: Validate Deployment Variables
          run: |
            if [[ ! "$NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
              echo "NAMESPACE must be set to a valid Kubernetes namespace."
              exit 1
            fi
            if [[ ! "${{ vars.REPLICAS }}" =~ ^[1-9][0-9]*$ ]]; then
              echo "REPLICAS must be set to a positive integer."
              exit 1
            fi
            if [[ -z "$MONGO_USERNAME" || -z "$MONGO_PASSWORD" ]]; then
              echo "Set the MONGO_USERNAME repository variable and MONGO_PASSWORD repository secret."
              exit 1
            fi

        - name: Replace Tokens in Development Manifests
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '_{_'
            tokenSuffix: '_}_'
            files: '["kubernetes/development/*.yaml"]'
          env:
            NAMESPACE: ${{ env.NAMESPACE }}
            REPLICAS: ${{ vars.REPLICAS }}
            IMAGE: ${{ env.DOCKER_IMAGE }}
            INGRESS_IP: ${{ env.INGRESS_IP }}

        - name: Check files
          run: |
            cat kubernetes/development/*.yaml

        - name: Create Development Namespace and MongoDB
          run: |
            kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
            kubectl create deployment mongodb \
              --namespace "$NAMESPACE" \
              --image=mongo:5.0 \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl set env deployment/mongodb \
              --namespace "$NAMESPACE" \
              "MONGO_INITDB_ROOT_USERNAME=$MONGO_USERNAME" \
              "MONGO_INITDB_ROOT_PASSWORD=$MONGO_PASSWORD"
            kubectl expose deployment mongodb \
              --namespace "$NAMESPACE" \
              --port=27017 --target-port=27017 \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl rollout status deployment/mongodb --namespace "$NAMESPACE" --timeout=120s

            mongo_ready=false
            for attempt in $(seq 1 30); do
              if kubectl exec deployment/mongodb --namespace "$NAMESPACE" -- \
                mongosh --quiet --username "$MONGO_USERNAME" --password "$MONGO_PASSWORD" \
                --authenticationDatabase admin superData --eval 'db.adminCommand("ping")' >/dev/null 2>&1; then
                mongo_ready=true
                break
              fi
              sleep 2
            done
            if [ "$mongo_ready" != true ]; then
              echo "MongoDB did not become ready"
              exit 1
            fi
            kubectl exec deployment/mongodb --namespace "$NAMESPACE" -- \
              mongosh --quiet --username "$MONGO_USERNAME" --password "$MONGO_PASSWORD" \
              --authenticationDatabase admin superData --eval \
              'db.planets.insertMany([{id:1,name:"Mercury"},{id:2,name:"Venus"},{id:3,name:"Earth"},{id:4,name:"Mars"},{id:5,name:"Jupiter"},{id:6,name:"Saturn"},{id:7,name:"Uranus"},{id:8,name:"Neptune"}])'

        - name: Create MongoDB Secret
          run: |
            kubectl -n "$NAMESPACE" create secret generic mongo-db-creds \
              --from-literal="MONGO_URI=$MONGO_URI" \
              --from-literal="MONGO_USERNAME=$MONGO_USERNAME" \
              --from-literal="MONGO_PASSWORD=$MONGO_PASSWORD" \
              --save-config \
              --dry-run=client \
              -o yaml | kubectl apply -f -

        - name: Deploy to Dev Env
          run: |
            kubectl apply -f kubernetes/development/
            kubectl rollout status deployment/solar-system \
              --namespace "$NAMESPACE" --timeout=120s

        - name: Show Deployment Status
          run: kubectl get deployments,pods,services,ingresses --namespace "$NAMESPACE"

        - name: Test Kubernetes Deployment
          run: |
            kubectl port-forward --namespace ingress-nginx \
              service/ingress-nginx-controller 8080:80 \
              > /tmp/solar-system-port-forward.log 2>&1 &
            for attempt in $(seq 1 30); do
              if curl --silent --show-error \
                --header "Host: solar-system-${NAMESPACE}.127.0.0.1.nip.io" \
                --output /tmp/solar-system-response.json \
                --write-out '%{http_code}' \
                http://127.0.0.1:8080/live > /tmp/solar-system-http-status.txt; then
                status=$(cat /tmp/solar-system-http-status.txt)
                if [[ "$status" == "200" ]] && grep -q '"status":"live"' /tmp/solar-system-response.json; then
                  echo "Kubernetes ingress and app are live"
                  cat /tmp/solar-system-response.json
                  exit 0
                fi
              fi
              sleep 2
            done
            echo "Ingress health check failed"
            echo "HTTP status: $(cat /tmp/solar-system-http-status.txt 2>/dev/null || echo unavailable)"
            echo "Response body:"
            cat /tmp/solar-system-response.json 2>/dev/null || true
            echo "Ingress and service details:"
            kubectl describe ingress solar-system --namespace "$NAMESPACE" || true
            kubectl get endpoints,services --namespace "$NAMESPACE" || true
            echo "Ingress controller logs:"
            kubectl logs --namespace ingress-nginx \
              --selector=app.kubernetes.io/component=controller \
              --all-containers=true --tail=100 || true
            echo "Port-forward logs:"
            cat /tmp/solar-system-port-forward.log
            kubectl get pods,services --namespace "$NAMESPACE"
            exit 1
